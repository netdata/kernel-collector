---
name: CI
on:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-artifacts:
    name: Build Artifacts
    strategy:
      fail-fast: false
      matrix:
        kernel_version:
          - '7.2.8'
          - '6.16.2'
          - '6.12.0'
          - '6.8.2'
          - '5.16.18'
          - '5.17.15'
          - '5.15.63'
          - '5.14.0'
          - '5.11.19'
          - '5.10.139'
          - '5.4.210'
          - '5.4.17'
          - '4.16.18'
          - '4.18.0'
          - '4.14.291'
        libc:
          - static
          - glibc
          - musl
        exclude:
          - kernel_version: 5.4.17
            libc: static
          - kernel_version: 5.4.17
            libc: musl
        include:
          - kernel_version: '7.2.8'
            libc: glibc
            kernel_localversion: '-15-generic'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Run build.sh
        run: |
          if [ ${{ matrix.kernel_version }} = "6.12.0" ]; then
            os=centos10
          elif [ ${{ matrix.kernel_version }} = "5.14.0" ]; then
            os=centos9
          elif [ ${{ matrix.kernel_version }} = "5.4.17" ]; then
            os=oracle8
          elif [ ${{ matrix.kernel_version }} = "4.18.0" ]; then
            os=centos8
          else
            os=generic
          fi
          KERNEL_LOCALVERSION='${{ matrix.kernel_localversion }}' ./build.sh ${{ matrix.kernel_version }} ${{ matrix.libc }} "${os}"
      - name: List Artifacts
        run: |
          ls -lah artifacts
          test -f artifacts/netdata_ebpf-*.tar
          if [ "${{ matrix.kernel_version }}" = "6.12.0" ]; then
            artifact=$(find artifacts -maxdepth 1 -type f -name '*_6.12.rhf-*.tar' -print -quit)
            test -n "$artifact"
            tar -tf "$artifact" > artifact.list
            base_apps=(btrfs cachestat dc disk ext4 fd fdatasync fsync dns hardirq mdflush mount msync network_viewer nfs oomkill process shm socket softirq sync syncfs sync_file_range swap vfs xfs zfs)
            ringbuf_apps=(cachestat dc dns fd socket oomkill process shm swap vfs)
            arena_apps=(cachestat dc dns fd socket oomkill process shm swap vfs)
            for app in "${base_apps[@]}"; do
              for prefix in p r; do
                grep -Fxq "${prefix}netdata_ebpf_${app}.6.12.rhf.o" artifact.list
              done
            done
            for app in "${ringbuf_apps[@]}"; do
              for prefix in p r; do
                grep -Fxq "${prefix}netdata_ebpf_${app}_buffer.6.12.rhf.o" artifact.list
              done
            done
            for app in "${arena_apps[@]}"; do
              for prefix in p r; do
                grep -Fxq "${prefix}netdata_ebpf_${app}_arena.6.12.rhf.o" artifact.list
              done
            done
          fi
      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: artifacts-${{ matrix.kernel_version }}-${{ matrix.libc }}
          path: artifacts
